interface:
  display_name: "任务效率建议"
  short_description: "首条进度明确六项章程，末项展示建议或写无建议，发出后继续原任务"
  default_prompt: "使用 $implement-focused-feature，多步任务在适用阶段首条进度以“阶段启动章程”标识，依次标明目标、范围与保持项、动作与授权、验证边界、完成与停止、建议；未知事实写待核对，未核实授权写待判定，沿用专项流程并在当前授权内完整交付；建议固定放在章程末尾，依据已有输入最多给 1～2 条，没有可用内容时写“建议：无建议”，发出后立即按原要求继续，不等待、不因沉默采纳；简单设计问答只用建议部分并明确显示建议状态。"
